<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }

    #crosshair {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #fff;
      mix-blend-mode: difference;
    }
    #crosshair::before { width: 2px; height: 20px; left: -1px; top: -10px; }
    #crosshair::after  { width: 20px; height: 2px; left: -10px; top: -1px; }

    #hotbar {
      position: fixed; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 2px;
      background: rgba(0,0,0,0.6); padding: 3px; border-radius: 4px;
      z-index: 10;
    }
    .hotbar-slot {
      width: 48px; height: 48px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 3px; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .hotbar-slot.active { border-color: #fff; background: rgba(255,255,255,0.15); }
    .hotbar-slot .block-preview {
      width: 32px; height: 32px; border-radius: 2px;
    }
    .hotbar-slot .slot-num {
      position: absolute; top: 1px; left: 3px;
      font-size: 10px; color: rgba(255,255,255,0.6);
    }

    #debug {
      position: fixed; top: 8px; left: 8px;
      color: #fff; font-size: 12px; font-family: monospace;
      background: rgba(0,0,0,0.5); padding: 6px 10px;
      border-radius: 4px; z-index: 10; line-height: 1.6;
      pointer-events: none;
    }

    #menu-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
    }
    #menu-overlay h1 {
      color: #fff; font-size: 48px; font-weight: 700;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 16px;
    }
    #menu-overlay button {
      width: 260px; padding: 12px 0;
      font-size: 18px; font-weight: 600;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 4px; cursor: pointer;
      color: #fff; background: rgba(80,80,80,0.8);
      transition: background 0.15s;
    }
    #menu-overlay button:hover { background: rgba(100,100,100,0.9); }

    #menu-overlay input {
      width: 260px; padding: 12px;
      font-size: 16px; text-align: center;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 4px; background: rgba(40,40,40,0.9);
      color: #fff; outline: none;
    }
    #menu-overlay input::placeholder { color: rgba(255,255,255,0.4); }
    #menu-overlay .menu-section {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }
    #menu-overlay .menu-label {
      color: rgba(255,255,255,0.7); font-size: 13px; text-transform: uppercase;
      letter-spacing: 1px;
    }
    #menu-overlay .menu-divider {
      width: 200px; height: 1px; background: rgba(255,255,255,0.15);
      margin: 4px 0;
    }
    #menu-overlay .room-code-display {
      font-size: 32px; font-weight: 700; letter-spacing: 6px;
      color: #4fc3f7; text-shadow: 0 0 10px rgba(79,195,247,0.4);
    }
    #menu-overlay .error-msg {
      color: #ef5350; font-size: 14px; min-height: 20px;
    }

    #chat-box {
      position: fixed; bottom: 68px; left: 8px;
      width: 340px; max-height: 180px;
      display: flex; flex-direction: column;
      z-index: 15; pointer-events: none;
    }
    #chat-messages {
      flex: 1; overflow-y: auto; padding: 4px 8px;
      background: rgba(0,0,0,0.45); border-radius: 4px 4px 0 0;
      font-size: 13px; color: #fff; font-family: monospace;
      max-height: 140px; pointer-events: auto;
    }
    #chat-messages:empty { display: none; }
    .chat-line { margin: 2px 0; word-wrap: break-word; }
    .chat-line .chat-name { font-weight: 700; }
    .chat-line.server-msg { color: #ffd54f; font-style: italic; }
    #chat-input-wrap {
      display: none; pointer-events: auto;
    }
    #chat-input-wrap.active { display: flex; }
    #chat-input {
      flex: 1; padding: 6px 10px;
      font-size: 13px; font-family: monospace;
      background: rgba(0,0,0,0.7); color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 0 0 4px 4px; outline: none;
    }

    #health-bar {
      position: fixed; bottom: 64px; left: 50%;
      transform: translateX(-50%);
      display: none; z-index: 10;
      background: rgba(0,0,0,0.5); padding: 3px; border-radius: 4px;
    }
    #health-bar .hearts {
      display: flex; gap: 2px;
    }
    #health-bar .heart {
      width: 14px; height: 14px;
      background: #d03020; border-radius: 2px;
      position: relative;
      transition: background 0.15s;
    }
    #health-bar .heart.empty {
      background: #3a1010;
    }
    #health-bar .heart.half {
      background: linear-gradient(90deg, #d03020 50%, #3a1010 50%);
    }

    #damage-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 50;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(200,0,0,0.4));
      opacity: 0; transition: opacity 0.15s;
    }
    #damage-overlay.active { opacity: 1; }

    #death-screen {
      position: fixed; inset: 0;
      background: rgba(120,0,0,0.7); z-index: 100;
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #death-screen h2 {
      color: #fff; font-size: 48px; font-weight: 700;
      text-shadow: 2px 2px 0 #000;
    }
    #death-screen button {
      width: 220px; padding: 12px 0;
      font-size: 18px; font-weight: 600;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 4px; cursor: pointer;
      color: #fff; background: rgba(80,80,80,0.8);
      transition: background 0.15s;
    }
    #death-screen button:hover { background: rgba(100,100,100,0.9); }

    #world-picker {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 110;
      display: none; flex-direction: column;
      align-items: center; padding: 30px 20px;
      overflow-y: auto;
    }
    #world-picker h2 {
      color: #fff; font-size: 36px; font-weight: 700;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 8px;
    }
    #world-picker .wp-subtitle {
      color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 14px;
    }
    .mode-toggle {
      display: flex; gap: 0; margin-bottom: 18px;
      border-radius: 6px; overflow: visible;
      border: 2px solid rgba(255,255,255,0.2);
      z-index: 5; flex-shrink: 0;
    }
    .mode-btn {
      padding: 12px 32px; font-size: 15px; font-weight: 600;
      border: none; cursor: pointer; color: rgba(255,255,255,0.6);
      background: rgba(40,40,40,0.9); transition: all 0.15s;
      position: relative; line-height: 1.4;
    }
    .mode-btn:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.12); }
    .mode-btn:hover { background: rgba(60,60,60,0.9); color: rgba(255,255,255,0.85); }
    .mode-btn.active {
      background: rgba(79,195,247,0.25); color: #fff;
      box-shadow: inset 0 -2px 0 #4fc3f7;
    }
    .mode-btn .mode-icon { font-size: 18px; margin-right: 6px; }
    .mode-btn .mode-sub {
      display: block; font-size: 10px; font-weight: 400;
      color: rgba(255,255,255,0.4); margin-top: 2px;
    }
    .mode-btn.active .mode-sub { color: rgba(255,255,255,0.55); }
    #world-picker .wp-back {
      position: absolute; top: 16px; left: 20px;
      background: none; border: none; color: rgba(255,255,255,0.7);
      font-size: 16px; cursor: pointer; padding: 6px 12px;
      border-radius: 4px; transition: color 0.15s;
    }
    #world-picker .wp-back:hover { color: #fff; }
    #world-picker .wp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px; width: 100%; max-width: 900px;
    }
    .world-card {
      background: rgba(50,50,50,0.8);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 8px; cursor: pointer;
      overflow: hidden; transition: border-color 0.15s, transform 0.15s;
    }
    .world-card:hover {
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-2px);
    }
    .world-card .wc-preview {
      width: 100%; height: 100px;
      image-rendering: pixelated;
    }
    .world-card .wc-info {
      padding: 10px 12px;
    }
    .world-card .wc-name {
      color: #fff; font-size: 16px; font-weight: 700;
      margin-bottom: 4px;
    }
    .world-card .wc-desc {
      color: rgba(255,255,255,0.55); font-size: 12px;
      line-height: 1.4;
    }
    .world-card.random-card {
      border-color: rgba(79,195,247,0.3);
    }
    .world-card.random-card:hover {
      border-color: rgba(79,195,247,0.7);
    }
    .world-card.random-card .wc-preview {
      background: linear-gradient(135deg, #2a4a3a, #3a5a6a, #4a3a5a, #5a4a2a);
      display: flex; align-items: center; justify-content: center;
    }
    .world-card.random-card .wc-preview span {
      font-size: 36px; color: rgba(255,255,255,0.6);
    }

    #player-list {
      position: fixed; top: 8px; right: 8px;
      background: rgba(0,0,0,0.5); padding: 8px 12px;
      border-radius: 4px; color: #fff; font-size: 12px;
      font-family: monospace; z-index: 10; min-width: 140px;
      display: none;
    }
    #player-list .pl-title { font-weight: 700; margin-bottom: 4px; color: #4fc3f7; }
    .pl-entry { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .pl-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <div id="crosshair" style="display:none;"></div>
  <div id="health-bar"><div class="hearts" id="hearts"></div></div>
  <div id="damage-overlay"></div>
  <div id="death-screen">
    <h2>You Died!</h2>
    <button id="btn-respawn">Respawn</button>
  </div>
  <div id="hotbar" style="display:none;"></div>
  <div id="debug" style="display:none;"></div>
  <div id="player-list"></div>
  <div id="chat-box" style="display:none;">
    <div id="chat-messages"></div>
    <div id="chat-input-wrap">
      <input id="chat-input" type="text" placeholder="Type message..." maxlength="200" autocomplete="off" />
    </div>
  </div>
  <div id="world-picker">
    <button class="wp-back" id="wp-back">&larr; Back</button>
    <h2>Choose Your World</h2>
    <div class="wp-subtitle">Pick a biome to spawn in</div>
    <div class="mode-toggle" id="mode-toggle">
      <button class="mode-btn active" data-mode="survival">
        <span class="mode-icon">&#9876;</span>Survival
        <span class="mode-sub">Health, mobs, gravity</span>
      </button>
      <button class="mode-btn" data-mode="creative">
        <span class="mode-icon">&#9733;</span>Creative
        <span class="mode-sub">Fly, no damage, build free</span>
      </button>
    </div>
    <div class="wp-grid" id="wp-grid"></div>
  </div>
  <div id="menu-overlay">
    <h1>Minecraft Web</h1>
    <div class="menu-section">
      <span class="menu-label">Singleplayer</span>
      <button id="btn-new">New World</button>
      <button id="btn-continue" style="display:none;">Continue</button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <span class="menu-label">Multiplayer</span>
      <input id="input-name" type="text" placeholder="Your name" maxlength="16" value="" />
      <button id="btn-create-room">Create Room</button>
      <input id="input-code" type="text" placeholder="Room code" maxlength="5" style="text-transform:uppercase; letter-spacing:4px;" />
      <button id="btn-join-room">Join Room</button>
      <div class="error-msg" id="mp-error"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
