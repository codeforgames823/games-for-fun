<style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.162.0",
    "three/addons/": "https://esm.sh/three@0.162.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1018);
scene.fog = new THREE.FogExp2(0x0a1018, 0.009);

scene.add(new THREE.HemisphereLight(0xa8b8c8, 0x1a222c, 0.72));
scene.add(new THREE.AmbientLight(0x5a6a78, 0.45));

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 0);

const controls = new PointerLockControls(camera, document.body);
const clock = new THREE.Clock();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.18, 0.5, 0.9);
composer.addPass(bloomPass);

const filmGrainShader = {
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, intensity: { value: 0.04 }, vignetteStrength: { value: 0.32 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time; uniform float intensity; uniform float vignetteStrength;
    varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec4 color=texture2D(tDiffuse,vUv);
      float grain=rand(vUv*time)*intensity;
      color.rgb+=grain-intensity*0.5;
      float dist=distance(vUv,vec2(0.5));
      color.rgb*=1.0-dist*vignetteStrength*1.2;
      gl_FragColor=color;
    }`
};
const grainPass = new ShaderPass(filmGrainShader);
composer.addPass(grainPass);
const fxaaPass = new ShaderPass(FXAAShader);
fxaaPass.uniforms['resolution'].value.set(1/window.innerWidth, 1/window.innerHeight);
composer.addPass(fxaaPass);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  fxaaPass.uniforms['resolution'].value.set(1/w, 1/h);
});

let audioCtx;
function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type='sine', vol=0.1) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
}
function playNoise(dur, vol=0.05) {
  if (!audioCtx) return;
  const sz = audioCtx.sampleRate * dur, buf = audioCtx.createBuffer(1, sz, audioCtx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
  const s = audioCtx.createBufferSource(); s.buffer = buf;
  const g = audioCtx.createGain(); g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  s.connect(g); g.connect(audioCtx.destination); s.start();
}
function playFootstep() { playNoise(0.06, 0.04); playTone(70 + Math.random() * 30, 0.08, 'triangle', 0.035); }
function playInteract() { playTone(420, 0.12, 'sine', 0.07); setTimeout(() => playTone(620, 0.08, 'sine', 0.05), 70); }
function playPuzzleSolve() { [440,554,659,880].forEach((f,i) => setTimeout(() => playTone(f, 0.25, 'sine', 0.09), i * 110)); }
function playError() { playTone(180, 0.28, 'sawtooth', 0.07); }
function playDoorOpen() { for (let i = 0; i < 4; i++) setTimeout(() => playNoise(0.08, 0.035), i * 55); playTone(90, 0.45, 'triangle', 0.04); }
function playSlam() {
  playNoise(0.15, 0.12);
  playTone(55, 0.5, 'sawtooth', 0.1);
  setTimeout(() => playNoise(0.2, 0.06), 80);
}

function makeCanvasTex(w, h, drawFn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  drawFn(x, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const TEX = {};
TEX.concrete = makeCanvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#252a30'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 7000; i++) {
    const bri = 32 + Math.random() * 22;
    x.fillStyle = `rgba(${bri},${bri+2},${bri+4},0.35)`;
    x.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*3, 1+Math.random()*2);
  }
});
TEX.concrete.repeat.set(4, 4);

TEX.concreteDark = makeCanvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#14181c'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    const bri = 20 + Math.random() * 15;
    x.fillStyle = `rgba(${bri},${bri+2},${bri+4},0.3)`;
    x.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*3, 1);
  }
});
TEX.concreteDark.repeat.set(3, 3);

TEX.brick = makeCanvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#2d3238'; x.fillRect(0, 0, w, h);
  const bw = 64, bh = 32, gap = 3;
  for (let row = 0; row < h / bh; row++) {
    const off = (row % 2) * bw / 2;
    for (let col = -1; col < w / bw + 1; col++) {
      const bx = col * bw + off, by = row * bh;
      const r = 42 + Math.random() * 25, g = 46 + Math.random() * 22, b = 52 + Math.random() * 20;
      x.fillStyle = `rgb(${r},${g},${b})`;
      x.fillRect(bx + gap/2, by + gap/2, bw - gap, bh - gap);
    }
  }
});
TEX.brick.repeat.set(2, 2);

TEX.tile = makeCanvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#283038'; x.fillRect(0, 0, w, h);
  const ts = 64;
  for (let tx = 0; tx < w; tx += ts) {
    for (let ty = 0; ty < h; ty += ts) {
      const alt = ((tx/ts + ty/ts) % 2 === 0);
      x.fillStyle = alt ? '#242c34' : '#2c343c';
      x.fillRect(tx+1, ty+1, ts-2, ts-2);
    }
  }
});
TEX.tile.repeat.set(3, 3);

TEX.wood = makeCanvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#3a3530'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 35; i++) {
    x.strokeStyle = `rgba(55,50,45,${0.08+Math.random()*0.12})`;
    x.lineWidth = 1 + Math.random();
    const y = Math.random() * h;
    x.beginPath(); x.moveTo(0, y); x.lineTo(w, y + (Math.random()-0.5)*8); x.stroke();
  }
});

TEX.directory = makeCanvasTex(320, 200, (x, w, h) => {
  x.fillStyle = '#c8d0d8'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#1a2228'; x.font = 'bold 18px Segoe UI'; x.textAlign = 'center';
  x.fillText('EASTPORT CITY HALL', w/2, 32);
  x.font = '14px Segoe UI';
  x.fillText('Annex B — Municipal Block 59', w/2, 58);
  x.strokeStyle = '#2a3848'; x.strokeRect(8, 8, w-16, h-16);
  x.fillStyle = '#3a4858'; x.font = '11px monospace';
  x.fillText('Cold storage · Records intake', w/2, 100);
});

TEX.manifest = makeCanvasTex(384, 256, (x, w, h) => {
  x.fillStyle = '#e8ecf0'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#1a2228'; x.font = 'bold 14px Segoe UI';
  x.fillText('COLD CHAIN MANIFEST — Priority pull order', 12, 28);
  x.font = '12px monospace'; x.fillStyle = '#2a3848';
  x.fillText('1. B-14  (vaccine archive)', 16, 52);
  x.fillText('2. A-03  (deeds microfilm)', 16, 72);
  x.fillText('3. C-22  (legacy tapes)', 16, 92);
  x.fillStyle = '#4a6080'; x.font = '11px monospace';
  x.fillText('Lane header: 27-B priority', 16, 130);
});

TEX.schematic = makeCanvasTex(280, 180, (x, w, h) => {
  x.fillStyle = '#d0d8e0'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#1a2838'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(20, 90); x.lineTo(120, 90); x.lineTo(120, 40); x.lineTo(200, 40); x.lineTo(200, 130); x.lineTo(260, 130); x.stroke();
  x.fillStyle = '#1a2838'; x.font = '10px monospace';
  x.fillText('AUX FEED 27', 168, 35);
  x.fillText('Card ref: 27', 12, 170);
});

function makeNormalFromHeight(tex, strength=2) {
  const c = tex.image, w = c.width, h = c.height;
  const nc = document.createElement('canvas');
  nc.width = w; nc.height = h;
  const sx = c.getContext('2d'), nx = nc.getContext('2d');
  const src = sx.getImageData(0, 0, w, h).data;
  const dst = nx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let xx = 0; xx < w; xx++) {
      const idx = (y*w+xx)*4;
      const l = src[(y*w+Math.max(0,xx-1))*4]/255;
      const r = src[(y*w+Math.min(w-1,xx+1))*4]/255;
      const u = src[(Math.max(0,y-1)*w+xx)*4]/255;
      const d = src[(Math.min(h-1,y+1)*w+xx)*4]/255;
      dst.data[idx]   = ((l-r)*strength*0.5+0.5)*255;
      dst.data[idx+1] = ((u-d)*strength*0.5+0.5)*255;
      dst.data[idx+2] = 255;
      dst.data[idx+3] = 255;
    }
  }
  nx.putImageData(dst, 0, 0);
  const nt = new THREE.CanvasTexture(nc);
  nt.wrapS = nt.wrapT = THREE.RepeatWrapping;
  nt.repeat.copy(tex.repeat);
  return nt;
}

const NORM = {
  concrete: makeNormalFromHeight(TEX.concrete, 2.5),
  brick: makeNormalFromHeight(TEX.brick, 3),
  tile: makeNormalFromHeight(TEX.tile, 2),
};

const MAT = {
  concrete: new THREE.MeshStandardMaterial({ map: TEX.concrete, normalMap: NORM.concrete, roughness: 0.9, metalness: 0.06 }),
  concreteDark: new THREE.MeshStandardMaterial({ map: TEX.concreteDark, roughness: 0.95, metalness: 0.03 }),
  brick: new THREE.MeshStandardMaterial({ map: TEX.brick, normalMap: NORM.brick, roughness: 0.88, metalness: 0.05 }),
  tile: new THREE.MeshStandardMaterial({ map: TEX.tile, normalMap: NORM.tile, roughness: 0.72, metalness: 0.08 }),
  wood: new THREE.MeshStandardMaterial({ map: TEX.wood, roughness: 0.85, metalness: 0.04 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x3a4550, roughness: 0.55, metalness: 0.65 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x222830, roughness: 0.65, metalness: 0.55 }),
  rust: new THREE.MeshStandardMaterial({ color: 0x4a4038, roughness: 0.82, metalness: 0.25 }),
  greenExit: new THREE.MeshStandardMaterial({ color: 0x22aa66, emissive: 0x114422, emissiveIntensity: 0.8 }),
};

const GS = {
  started: false, paused: false, time: 0,
  velocity: new THREE.Vector3(),
  moveForward: false, moveBackward: false, moveLeft: false, moveRight: false,
  isSprinting: false,
  currentRoom: 0,
  inventory: [null,null,null,null,null], selectedSlot: 0,
  puzzlesSolved: new Set(), doorsUnlocked: new Set(), itemsCollected: new Set(), notesRead: new Set(),
  flashlight: { on: true, battery: 100 },
  nearInteractable: null,
  dialogue: { active: false, text: '', charIndex: 0, timer: 0, fullText: '', callback: null },
  puzzleActive: false, currentPuzzle: null,
  footstepTimer: 0,
  roomGroups: [], interactables3D: [], doors3D: [],
  flickerLights: [], corridorLights: [],
  slamPlayed: false,
};

const flashlight = new THREE.SpotLight(0xf2f6ff, 5.2, 28, Math.PI * 0.32, 0.5, 1.2);
flashlight.castShadow = true;
flashlight.shadow.mapSize.set(1024, 1024);
flashlight.shadow.camera.near = 0.1;
flashlight.shadow.camera.far = 22;
flashlight.shadow.bias = -0.002;
const flTarget = new THREE.Object3D();
scene.add(flTarget);
flashlight.target = flTarget;
camera.add(flashlight);
flashlight.position.set(0.28, -0.12, -0.28);
scene.add(camera);

function makeBox(w, h, d, mat, pos, castShadow=true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.copy(pos);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  return m;
}

function makeCylinder(rT, rB, h, mat, pos, segs=16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, segs), mat);
  m.position.copy(pos);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function makeDesk(pos) {
  const g = new THREE.Group();
  g.add(makeBox(1.5, 0.05, 0.75, MAT.wood, new THREE.Vector3(0, 0.74, 0)));
  [[-0.7,0.35,-0.28],[0.7,0.35,-0.28],[-0.7,0.35,0.28],[0.7,0.35,0.28]].forEach(([a,b,c]) =>
    g.add(makeBox(0.05, 0.7, 0.05, MAT.wood, new THREE.Vector3(a, b, c))));
  g.position.copy(pos);
  return g;
}

function makeChair(pos) {
  const g = new THREE.Group();
  const cm = new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: 0.9 });
  g.add(makeBox(0.42, 0.04, 0.42, cm, new THREE.Vector3(0, 0.44, 0)));
  g.add(makeBox(0.42, 0.48, 0.04, cm, new THREE.Vector3(0, 0.68, -0.19)));
  g.position.copy(pos);
  return g;
}

function makeCabinet(pos) {
  const g = new THREE.Group();
  const cm = new THREE.MeshStandardMaterial({ color: 0x353a42, roughness: 0.88 });
  g.add(makeBox(0.65, 2.1, 0.42, cm, new THREE.Vector3(0, 1.05, 0)));
  g.add(makeBox(0.04, 0.04, 0.04, MAT.metal, new THREE.Vector3(0, 1.4, 0.22)));
  g.position.copy(pos);
  return g;
}

function makeCrate(pos, size=1) {
  const g = new THREE.Group();
  const s = 0.48 * size;
  g.add(makeBox(s, s, s, MAT.wood, new THREE.Vector3(0, s/2, 0)));
  g.add(makeBox(s+0.02, 0.04, 0.04, MAT.darkMetal, new THREE.Vector3(0, s-0.02, s/2-0.02)));
  g.position.copy(pos);
  return g;
}

function makeShelf(pos) {
  const g = new THREE.Group();
  g.add(makeBox(1.1, 0.04, 0.45, MAT.wood, new THREE.Vector3(0, 0.02, 0)));
  for (const sx of [-0.52, 0.52]) {
    g.add(makeBox(0.04, 2.4, 0.04, MAT.metal, new THREE.Vector3(sx, 1.2, -0.2)));
    g.add(makeBox(0.04, 2.4, 0.04, MAT.metal, new THREE.Vector3(sx, 1.2, 0.2)));
  }
  for (let sh = 0.55; sh < 2.3; sh += 0.65) {
    g.add(makeBox(1.06, 0.03, 0.42, MAT.wood, new THREE.Vector3(0, sh, 0)));
  }
  g.position.copy(pos);
  return g;
}

function makePoster3D(pos, tex, rot=0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.55), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
  m.position.copy(pos);
  m.rotation.y = rot;
  return m;
}

function makeDoorFrame(pos, rot=0, color=0x3a4248) {
  const g = new THREE.Group();
  const dm = new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0.35 });
  g.add(makeBox(0.1, 2.4, 0.28, dm, new THREE.Vector3(-0.52, 1.2, 0)));
  g.add(makeBox(0.1, 2.4, 0.28, dm, new THREE.Vector3(0.52, 1.2, 0)));
  g.add(makeBox(1.14, 0.1, 0.28, dm, new THREE.Vector3(0, 2.4, 0)));
  const door = makeBox(0.95, 2.25, 0.07, dm, new THREE.Vector3(0, 1.125, 0));
  g.add(door);
  g.add(makeCylinder(0.022, 0.022, 0.04, MAT.metal, new THREE.Vector3(0.32, 1.0, 0.05), 8));
  g.position.copy(pos);
  g.rotation.y = rot;
  g.userData.doorMesh = door;
  return g;
}

function addLight(pos, color=0xa8c0d8, intensity=0.85, dist=9, flicker=true, storeCorridor=false, startDim=1) {
  const pl = new THREE.PointLight(color, intensity * startDim, dist);
  pl.position.copy(pos);
  pl.castShadow = true;
  pl.shadow.mapSize.set(512, 512);
  pl.shadow.bias = -0.003;
  scene.add(pl);
  if (flicker) GS.flickerLights.push({ light: pl, base: intensity * startDim, speed: 1.8+Math.random()*2, offset: Math.random()*8 });
  if (storeCorridor) GS.corridorLights.push({ light: pl, bright: intensity, dim: Math.max(0.28, intensity * 0.38) });
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.6 * startDim }));
  bulb.position.copy(pos);
  scene.add(bulb);
  return pl;
}

function setCorridorPowered(on) {
  GS.corridorLights.forEach(({ light, bright, dim }) => {
    light.intensity = on ? bright : dim;
    const idx = GS.flickerLights.findIndex(f => f.light === light);
    if (idx >= 0) GS.flickerLights[idx].base = on ? bright : dim;
  });
}

function buildRoom(idx, rw, rd, floorMat, wallMat, ceilMat) {
  const g = new THREE.Group();
  g.userData.roomIndex = idx;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(rw, rd), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  g.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(rw, rd), ceilMat || MAT.concreteDark);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = 3.2;
  ceil.receiveShadow = true;
  g.add(ceil);
  const wallH = 3.2;
  const addWall = (w, h, pos, rotY=0) => {
    const wm = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
    wm.position.copy(pos);
    wm.rotation.y = rotY;
    wm.receiveShadow = true;
    g.add(wm);
  };
  addWall(rw, wallH, new THREE.Vector3(0, wallH/2, -rd/2), 0);
  addWall(rw, wallH, new THREE.Vector3(0, wallH/2, rd/2), Math.PI);
  addWall(rd, wallH, new THREE.Vector3(-rw/2, wallH/2, 0), Math.PI/2);
  addWall(rd, wallH, new THREE.Vector3(rw/2, wallH/2, 0), -Math.PI/2);
  return g;
}

const moveSpeed = 4.8;
const sprintMult = 1.55;

function updateMovement(dt) {
  if (!controls.isLocked || GS.paused) return;
  const speed = GS.isSprinting ? moveSpeed * sprintMult : moveSpeed;
  const dir = new THREE.Vector3();
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0; forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

  if (GS.moveForward) dir.add(forward);
  if (GS.moveBackward) dir.sub(forward);
  if (GS.moveRight) dir.add(right);
  if (GS.moveLeft) dir.sub(right);

  if (dir.length() > 0) {
    dir.normalize();
    const newPos = camera.position.clone().add(dir.multiplyScalar(speed * dt));
    const off = ROOM_OFFSETS[GS.currentRoom];
    const { w: roomW, d: roomD } = ROOM_BOUNDS[GS.currentRoom];
    const margin = 0.45;
    newPos.x = Math.max(off.x - roomW/2 + margin, Math.min(off.x + roomW/2 - margin, newPos.x));
    newPos.z = Math.max(off.z - roomD/2 + margin, Math.min(off.z + roomD/2 - margin, newPos.z));
    newPos.y = 1.7;
    camera.position.copy(newPos);
    GS.footstepTimer -= dt;
    if (GS.footstepTimer <= 0) {
      playFootstep();
      GS.footstepTimer = GS.isSprinting ? 0.26 : 0.36;
    }
    camera.position.y = 1.7 + Math.sin(GS.time * (GS.isSprinting ? 13 : 9)) * 0.025;
  }

  const flDir = new THREE.Vector3();
  camera.getWorldDirection(flDir);
  flTarget.position.copy(camera.position).add(flDir.multiplyScalar(10));
}

function updateFlashlight(dt) {
  if (GS.flashlight.on) {
    GS.flashlight.battery -= dt * 0.28;
    if (GS.flashlight.battery < 0) GS.flashlight.battery = 0;
  }
  const pct = GS.flashlight.battery / 100;
  const baseInt = GS.flashlight.on ? (pct > 0 ? 5.2 * (0.35 + 0.65 * pct) : 0.85) : 0;
  flashlight.visible = GS.flashlight.on;
  flashlight.intensity = baseInt;
  document.getElementById('battery-fill').style.width = Math.max(4, pct * 100) + '%';
  document.getElementById('battery-fill').style.background = pct > 0.45 ? '#4a8a6a' : pct > 0.12 ? '#a08040' : '#6a4048';
}

function updateFlickerLights() {
  GS.flickerLights.forEach(fl => {
    fl.light.intensity = fl.base * (0.75 + Math.sin(GS.time * fl.speed + fl.offset) * 0.22 + Math.random() * 0.04);
  });
}

function showDialogue(text, cb) {
  GS.dialogue = { active: true, fullText: text, text: '', charIndex: 0, timer: 0, callback: cb };
  document.getElementById('dialogue-box').style.display = 'block';
}

function updateDialogue(dt) {
  if (!GS.dialogue.active) return;
  GS.dialogue.timer += dt;
  if (GS.dialogue.charIndex < GS.dialogue.fullText.length) {
    if (GS.dialogue.timer > 0.018) {
      GS.dialogue.charIndex++;
      GS.dialogue.text = GS.dialogue.fullText.substring(0, GS.dialogue.charIndex);
      GS.dialogue.timer = 0;
      document.getElementById('dialogue-box').textContent = GS.dialogue.text + (GS.dialogue.charIndex < GS.dialogue.fullText.length ? '▌' : '');
      if (GS.dialogue.charIndex % 4 === 0) playTone(280 + Math.random() * 60, 0.025, 'sine', 0.012);
    }
  } else if (GS.dialogue.timer > 2.8) {
    GS.dialogue.active = false;
    document.getElementById('dialogue-box').style.display = 'none';
    if (GS.dialogue.callback) GS.dialogue.callback();
  }
}

function addInventoryItem(id, name) {
  for (let i = 0; i < GS.inventory.length; i++) {
    if (!GS.inventory[i]) { GS.inventory[i] = { id, name }; updateInventoryUI(); return true; }
  }
  return false;
}

function removeInventoryItem(id) {
  for (let i = 0; i < GS.inventory.length; i++) {
    if (GS.inventory[i] && GS.inventory[i].id === id) { GS.inventory[i] = null; updateInventoryUI(); return true; }
  }
  return false;
}

function hasItem(id) {
  return GS.inventory.some(s => s && s.id === id);
}

function updateInventoryUI() {
  const icons = { vault_key_fob: '🔖' };
  for (let i = 0; i < 5; i++) {
    const s = document.getElementById(`inv-${i}`);
    s.className = 'inv-slot' + (i === GS.selectedSlot ? ' active' : '');
    const item = GS.inventory[i];
    s.innerHTML = item ? `${icons[item.id] || '📦'}<span class="lbl">${item.name}</span>` : '';
  }
}

function updateInteraction() {
  if (!controls.isLocked || GS.paused) return;
  const pPos = camera.position;
  let nearest = null, nearDist = 3;

  GS.interactables3D.forEach(inter => {
    if (inter.roomIdx !== GS.currentRoom) return;
    if (inter.type === 'puzzle' && GS.puzzlesSolved.has(inter.id)) return;
    if (inter.type === 'container' && GS.itemsCollected.has(inter.id)) return;
    if (inter.requiresItem && !hasItem(inter.requiresItem)) return;
    const d = pPos.distanceTo(inter.pos);
    if (d < inter.radius && d < nearDist) { nearDist = d; nearest = inter; }
  });

  GS.doors3D.forEach(door => {
    if (door.roomIdx !== GS.currentRoom) return;
    const d = pPos.distanceTo(door.pos);
    if (d < 2.4 && d < nearDist) { nearDist = d; nearest = { ...door, type: 'door' }; }
  });

  GS.nearInteractable = nearest;
  const prompt = document.getElementById('interact-prompt');
  if (nearest) {
    prompt.style.opacity = '1';
    if (nearest.type === 'door') {
      const unlocked = GS.doorsUnlocked.has(nearest.id) || !nearest.locked;
      prompt.textContent = unlocked ? '[E] Use door' : `[E] Locked — ${(nearest.requires || '').replace(/_/g, ' ')}`;
    } else if (nearest.type === 'note') prompt.textContent = '[E] Read';
    else if (nearest.type === 'examine') prompt.textContent = '[E] Examine';
    else if (nearest.type === 'puzzle') {
      if (nearest.requiresItem && !hasItem(nearest.requiresItem)) prompt.textContent = '[Need vault fob]';
      else prompt.textContent = `[E] ${nearest.label || 'Puzzle'}`;
    }
  } else prompt.style.opacity = '0';
}

function maybePlaySlam(fromRoom, toRoom) {
  if (toRoom === 2 && fromRoom !== 2 && !GS.slamPlayed) {
    GS.slamPlayed = true;
    setTimeout(() => playSlam(), 400);
  }
}

function enterDoor(door) {
  if (door.isExit) { showVictory(); return; }
  playDoorOpen();
  const fromRoom = GS.currentRoom;
  GS.currentRoom = door.targetRoom;
  camera.position.copy(door.targetPos);
  maybePlaySlam(fromRoom, GS.currentRoom);
  const rd = ROOM_DEFS[GS.currentRoom];
  document.getElementById('room-name').textContent = rd.name;
  document.getElementById('objective').textContent = rd.objective;
}

function handleInteraction() {
  if (GS.paused || GS.puzzleActive || GS.dialogue.active) return;
  const inter = GS.nearInteractable;
  if (!inter) return;
  playInteract();

  if (inter.type === 'door') {
    const unlocked = GS.doorsUnlocked.has(inter.id) || !inter.locked;
    if (unlocked) {
      enterDoor(inter);
    } else {
      const req = inter.requires;
      if (req && req.startsWith('puzzle:')) {
        const pid = req.replace('puzzle:', '');
        if (GS.puzzlesSolved.has(pid)) {
          GS.doorsUnlocked.add(inter.id);
          enterDoor(inter);
        } else { showDialogue('Mag lock engaged. Finish the related task first.'); playError(); }
      } else if (req && GS.inventory.some(s => s && s.id === req)) {
        GS.doorsUnlocked.add(inter.id);
        removeInventoryItem(req);
        showDialogue('The mag lock reads your fob and releases.');
        enterDoor(inter);
      } else {
        showDialogue(req ? `Locked. You still need: ${req.replace(/_/g, ' ')}` : 'Locked.');
        playError();
      }
    }
  } else if (inter.type === 'note') {
    showDialogue(inter.text);
    GS.notesRead.add(inter.id);
  } else if (inter.type === 'examine') {
    showDialogue(inter.text);
  } else if (inter.type === 'puzzle') {
    if (inter.requiresItem && !hasItem(inter.requiresItem)) {
      showDialogue('A small LED reads INSERT FOB. You need the cold-chain access token from storage.');
      playError();
      return;
    }
    if (!GS.puzzlesSolved.has(inter.id)) openPuzzle(inter);
  }
}

function openPuzzle(inter) {
  GS.puzzleActive = true;
  GS.currentPuzzle = inter;
  GS.paused = true;
  controls.unlock();
  document.getElementById('puzzle-overlay').style.display = 'flex';
  document.getElementById('puzzle-title').textContent = inter.label || 'PUZZLE';
  const pt = inter.puzzleType;
  if (pt === 'wire') buildWirePuzzle();
  else if (pt === 'combo') buildComboPuzzle(inter);
  else if (pt === 'sequence') buildSequencePuzzle(inter);
  else if (pt === 'keypad') buildKeypadPuzzle(inter);
}

function closePuzzle() {
  if (!GS.puzzleActive) return;
  GS.puzzleActive = false;
  GS.paused = false;
  document.getElementById('puzzle-overlay').style.display = 'none';
  document.getElementById('puzzle-content').innerHTML = '';
  document.body.requestPointerLock();
}

document.getElementById('puzzle-close').addEventListener('click', closePuzzle);

function buildWirePuzzle() {
  const content = document.getElementById('puzzle-content');
  const colors = ['#c44', '#44c', '#4c4', '#cc4'];
  const shuffled = [...colors].sort(() => Math.random() - 0.5);
  let html = `<div style="color:#7a8a9a;margin-bottom:12px;font-size:.85em">Match colored aux pairs. Click left port, then matching right.</div>`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;height:200px">`;
  html += `<div style="display:flex;flex-direction:column;gap:14px">`;
  colors.forEach((c) => {
    html += `<div class="wl" data-color="${c}" style="width:38px;height:28px;background:${c};cursor:pointer;border-radius:4px;border:2px solid #2a3848" onclick="window._annexWireClick(this,'left')"></div>`;
  });
  html += `</div><canvas id="wire-canvas" width="280" height="200" style="flex:1;margin:0 16px"></canvas><div style="display:flex;flex-direction:column;gap:14px">`;
  shuffled.forEach((c) => {
    html += `<div class="wr" data-color="${c}" style="width:38px;height:28px;background:${c};cursor:pointer;border-radius:4px;border:2px solid #2a3848" onclick="window._annexWireClick(this,'right')"></div>`;
  });
  html += `</div></div>`;
  content.innerHTML = html;
  window._ws = { sel: null, conns: [], target: colors.length };
}

window._annexWireClick = function(el, side) {
  const ws = window._ws;
  if (!ws) return;
  if (!ws.sel) {
    if (side === 'left') {
      ws.sel = { side, color: el.dataset.color, el };
      el.style.outline = '2px solid #fff';
      playTone(400, 0.08, 'sine', 0.05);
    }
  } else {
    if (side === 'right' && ws.sel.side === 'left') {
      if (ws.sel.color === el.dataset.color) {
        ws.conns.push({ color: ws.sel.color });
        ws.sel.el.style.opacity = '0.35';
        ws.sel.el.style.pointerEvents = 'none';
        el.style.opacity = '0.35';
        el.style.pointerEvents = 'none';
        ws.sel.el.style.outline = 'none';
        playTone(580, 0.12, 'sine', 0.06);
        const cv = document.getElementById('wire-canvas');
        if (cv) {
          const x = cv.getContext('2d');
          x.clearRect(0, 0, 280, 200);
          ws.conns.forEach((c, i) => {
            const ly = 20 + i * 44;
            x.strokeStyle = c.color;
            x.lineWidth = 3;
            x.beginPath();
            x.moveTo(0, ly);
            x.bezierCurveTo(90, ly, 190, ly, 280, ly);
            x.stroke();
          });
        }
        if (ws.conns.length >= ws.target) setTimeout(() => solvePuzzle(GS.currentPuzzle), 450);
      } else {
        ws.sel.el.style.outline = 'none';
        playError();
      }
      ws.sel = null;
    } else {
      if (ws.sel.el) ws.sel.el.style.outline = 'none';
      ws.sel = null;
    }
  }
};

function buildComboPuzzle(inter) {
  const n = inter.digits || 3;
  const content = document.getElementById('puzzle-content');
  let html = `<div style="color:#7a8a9a;margin-bottom:14px;font-size:.85em">Enter ${n} digits (click ▲▼).</div><div style="display:flex;gap:16px;justify-content:center;align-items:flex-end">`;
  for (let i = 0; i < n; i++) {
    html += `<div style="text-align:center"><button type="button" style="width:44px;padding:4px;background:#2a3848;color:#aab8c8;border:1px solid #4a5a6a;cursor:pointer;border-radius:4px" data-d="${i}" class="cb-up">▲</button>`;
    html += `<div id="cd-${i}" style="font-size:2em;color:#dde8f0;margin:8px 0">0</div>`;
    html += `<button type="button" style="width:44px;padding:4px;background:#2a3848;color:#aab8c8;border:1px solid #4a5a6a;cursor:pointer;border-radius:4px" data-d="${i}" class="cb-dn">▼</button></div>`;
  }
  html += `</div><button type="button" id="cb-go" style="margin-top:22px;display:block;width:100%;padding:10px;background:#3a5a70;color:#dde8f0;border:none;border-radius:4px;cursor:pointer;font-size:1em">Enter</button>`;
  content.innerHTML = html;
  window._cd = new Array(n).fill(0);
  content.querySelectorAll('.cb-up').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.d;
    window._cd[i] = (window._cd[i] + 1) % 10;
    document.getElementById(`cd-${i}`).textContent = window._cd[i];
    playTone(350, 0.05, 'sine', 0.04);
  }));
  content.querySelectorAll('.cb-dn').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.d;
    window._cd[i] = (window._cd[i] + 9) % 10;
    document.getElementById(`cd-${i}`).textContent = window._cd[i];
    playTone(300, 0.05, 'sine', 0.04);
  }));
  document.getElementById('cb-go').addEventListener('click', () => {
    const s = window._cd.join('');
    if (s === inter.solution) solvePuzzle(inter);
    else { playError(); showDialogue('Denied. Recheck the plaque years (ones digits, oldest to newest).'); }
  });
}

function buildSequencePuzzle(inter) {
  const content = document.getElementById('puzzle-content');
  const order = inter.order;
  const shuffled = [...order].sort(() => Math.random() - 0.5);
  let html = `<div style="color:#7a8a9a;margin-bottom:12px;font-size:.85em">Tap crates in manifest order (see poster on wall).</div><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">`;
  shuffled.forEach((tag) => {
    html += `<button type="button" class="seq-btn" data-tag="${tag}" style="padding:14px 20px;background:#1e2832;border:1px solid #3a4a5a;color:#c8d8e8;font-family:inherit;cursor:pointer;border-radius:6px;font-size:1em">${tag}</button>`;
  });
  html += `</div><div id="seq-prog" style="margin-top:16px;text-align:center;color:#6a8a9a;font-size:.9em">Progress: —</div>`;
  content.innerHTML = html;
  window._sq = { want: [...order], idx: 0 };
  content.querySelectorAll('.seq-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      const w = window._sq.want[window._sq.idx];
      if (tag !== w) {
        window._sq.idx = 0;
        playError();
        document.getElementById('seq-prog').textContent = 'Wrong order — sequence reset.';
        content.querySelectorAll('.seq-btn').forEach(b => { b.disabled = false; b.style.opacity = '1'; });
        return;
      }
      window._sq.idx++;
      btn.disabled = true;
      btn.style.opacity = '0.4';
      playTone(500 + window._sq.idx * 40, 0.1, 'sine', 0.06);
      document.getElementById('seq-prog').textContent = `Progress: ${window._sq.idx} / ${window._sq.want.length}`;
      if (window._sq.idx >= window._sq.want.length) setTimeout(() => solvePuzzle(inter), 400);
    });
  });
}

function buildKeypadPuzzle(inter) {
  const content = document.getElementById('puzzle-content');
  let html = `<div style="color:#7a8a9a;margin-bottom:12px;font-size:.85em">Four-digit service PIN. Lobby directory (59) + schematic tail (27).</div>`;
  html += `<div id="kp-disp" style="font-size:1.8em;letter-spacing:.3em;text-align:center;color:#dde8f0;margin:12px 0;font-family:monospace">____</div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto">`;
  for (const n of [1,2,3,4,5,6,7,8,9]) {
    html += `<button type="button" class="kp-n" data-n="${n}" style="padding:12px;background:#2a3848;color:#dde8f0;border:1px solid #4a5a6a;border-radius:4px;cursor:pointer">${n}</button>`;
  }
  html += `<button type="button" class="kp-n" data-n="c" style="grid-column:span 3;padding:8px;background:#3a2828">Clear</button>`;
  html += `<button type="button" class="kp-n" data-n="0" style="grid-column:span 3;padding:12px;background:#2a3848;color:#dde8f0;border:1px solid #4a5a6a;border-radius:4px;cursor:pointer">0</button>`;
  html += `</div>`;
  content.innerHTML = html;
  window._kp = '';
  content.querySelectorAll('.kp-n').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.n;
      if (v === 'c') { window._kp = ''; }
      else if (window._kp.length < 4) window._kp += v;
      const disp = document.getElementById('kp-disp');
      disp.textContent = (window._kp + '____').slice(0, 4);
      playTone(400, 0.04, 'sine', 0.04);
      if (window._kp.length === 4) {
        if (window._kp === inter.solution) setTimeout(() => solvePuzzle(inter), 300);
        else {
          playError();
          window._kp = '';
          disp.textContent = '____';
        }
      }
    });
  });
}

function solvePuzzle(inter) {
  GS.puzzlesSolved.add(inter.id);
  playPuzzleSolve();
  closePuzzle();
  bloomPass.strength = 0.55;
  setTimeout(() => { bloomPass.strength = 0.22; }, 400);

  if (inter.puzzleType === 'wire') {
    showDialogue('Breakers latch. Relay closes — the storage corridor lights surge on.');
    setCorridorPowered(true);
    GS.doors3D.forEach(d => { if (d.requires === 'puzzle:' + inter.id) GS.doorsUnlocked.add(d.id); });
  } else if (inter.puzzleType === 'combo') {
    showDialogue('The inner door unlocks with a heavy clunk.');
    GS.doors3D.forEach(d => { if (d.requires === 'puzzle:' + inter.id) GS.doorsUnlocked.add(d.id); });
  } else if (inter.puzzleType === 'sequence') {
    addInventoryItem('vault_key_fob', 'vault key fob');
    showDialogue('The manifest printer spits a laminated fob: COLD STORAGE — VAULT OVERRIDE.');
  } else if (inter.puzzleType === 'keypad') {
    showDialogue('PIN accepted. The service door mag lock disengages.');
    GS.doors3D.forEach(d => { if (d.requires === 'puzzle:' + inter.id) GS.doorsUnlocked.add(d.id); });
  }
}

function showVictory() {
  GS.paused = true;
  controls.unlock();
  bloomPass.strength = 0.9;
  setTimeout(() => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:#05080c;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Segoe UI,system-ui,sans-serif;padding:24px';
    const lines = [
      ['You push into the stairwell. Emergency strip lighting hums overhead.', '#aab8c8', '15px'],
      ['', '', ''],
      ['Behind you, Annex B settles into silence — just rain on the loading ramp.', '#6a7a88', '13px'],
      ['', '', ''],
      ['— EASTPORT ANNEX B —', '#6a9aba', '18px'],
      ['', '', ''],
      ['Thanks for playing.', '#5a6570', '12px'],
      ['Press R to restart', '#4a5560', '11px'],
    ];
    lines.forEach(([t, c, s]) => {
      const p = document.createElement('p');
      p.textContent = t;
      p.style.cssText = `color:${c};font-size:${s};margin:5px 0`;
      ov.appendChild(p);
    });
    document.body.appendChild(ov);
    window.addEventListener('keydown', function r(e) {
      if (e.key.toLowerCase() === 'r') { window.removeEventListener('keydown', r); location.reload(); }
    });
  }, 600);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && GS.puzzleActive) { closePuzzle(); return; }
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': GS.moveForward = true; break;
    case 'KeyS': case 'ArrowDown': GS.moveBackward = true; break;
    case 'KeyA': case 'ArrowLeft': GS.moveLeft = true; break;
    case 'KeyD': case 'ArrowRight': GS.moveRight = true; break;
    case 'ShiftLeft': case 'ShiftRight': GS.isSprinting = true; break;
    case 'KeyE': handleInteraction(); break;
    case 'KeyF':
      GS.flashlight.on = !GS.flashlight.on;
      playTone(GS.flashlight.on ? 480 : 320, 0.08, 'sine', 0.05);
      break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5':
      GS.selectedSlot = parseInt(e.code.replace('Digit', ''), 10) - 1;
      updateInventoryUI();
      break;
  }
});
document.addEventListener('keyup', e => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': GS.moveForward = false; break;
    case 'KeyS': case 'ArrowDown': GS.moveBackward = false; break;
    case 'KeyA': case 'ArrowLeft': GS.moveLeft = false; break;
    case 'KeyD': case 'ArrowRight': GS.moveRight = false; break;
    case 'ShiftLeft': case 'ShiftRight': GS.isSprinting = false; break;
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'KeyE' && GS.dialogue.active && GS.dialogue.charIndex >= GS.dialogue.fullText.length) {
    GS.dialogue.active = false;
    document.getElementById('dialogue-box').style.display = 'none';
    if (GS.dialogue.callback) GS.dialogue.callback();
  }
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  GS.time += dt;
  if (GS.started && !GS.paused) {
    updateMovement(dt);
    updateFlashlight(dt);
    updateInteraction();
    updateDialogue(dt);
    updateFlickerLights();
    grainPass.uniforms.time.value = GS.time;
  }
  composer.render();
}

const blocker = document.getElementById('blocker');
blocker.addEventListener('click', () => {
  if (!GS.started) {
    initAudio();
    buildAllRooms();
    GS.started = true;
    const rd = ROOM_DEFS[0];
    camera.position.set(ROOM_OFFSETS[0].x + rd.spawnX, 1.7, ROOM_OFFSETS[0].z + rd.spawnZ);
    document.getElementById('room-name').textContent = rd.name;
    document.getElementById('objective').textContent = rd.objective;
    updateInventoryUI();
    showDialogue('The annex is sealed. Your phone has no signal down here. Use the keypad beside the inner door — the note on the desk should help.');
  }
  controls.lock();
});

controls.addEventListener('lock', () => { blocker.classList.add('hidden'); });
controls.addEventListener('unlock', () => { if (!GS.puzzleActive && !GS.paused) blocker.classList.remove('hidden'); });

animate();
</script>
