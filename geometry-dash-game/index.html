  document.getElementById('setBpm').value = editorLevelSettings.bpm;
  document.getElementById('setColor').value = editorLevelSettings.color;
  document.getElementById('settingsModal').style.display = 'block';
  document.getElementById('overlayBg').style.display = 'block';
});
document.getElementById('setApply').addEventListener('click', () => {
  editorLevelSettings.name = document.getElementById('setName').value || 'My Level';
  editorLevelSettings.difficulty = document.getElementById('setDifficulty').value;
  editorLevelSettings.speed = parseFloat(document.getElementById('setSpeed').value) || 7;
  editorLevelSettings.bpm = parseInt(document.getElementById('setBpm').value) || 140;
  const c = document.getElementById('setColor').value;
  editorLevelSettings.color = c;
  const r=parseInt(c.slice(1,3),16), g2=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
  editorLevelSettings.bgColor1 = `rgb(${Math.floor(r*0.06)},${Math.floor(g2*0.06)},${Math.floor(b*0.15)})`;
  editorLevelSettings.bgColor2 = `rgb(${Math.floor(r*0.1)},${Math.floor(g2*0.1)},${Math.floor(b*0.25)})`;
  editorLevelSettings.groundColor = `rgb(${Math.floor(r*0.15)},${Math.floor(g2*0.15)},${Math.floor(b*0.1)})`;
  document.getElementById('settingsModal').style.display = 'none';
  document.getElementById('overlayBg').style.display = 'none';
});
document.getElementById('setCancel').addEventListener('click', () => {
  document.getElementById('settingsModal').style.display = 'none';
  document.getElementById('overlayBg').style.display = 'none';
});
document.getElementById('btnShare').addEventListener('click', () => {
  document.getElementById('shareCode').value = exportLevel();
  document.getElementById('shareModal').style.display = 'block';
  document.getElementById('overlayBg').style.display = 'block';
});
document.getElementById('shareCopy').addEventListener('click', () => {
  const ta = document.getElementById('shareCode');
  ta.select(); navigator.clipboard.writeText(ta.value).catch(()=>{});
  document.getElementById('shareCopy').textContent = 'Copied!';
  setTimeout(()=>{ document.getElementById('shareCopy').textContent = 'Copy to Clipboard'; }, 1500);
});
document.getElementById('shareClose').addEventListener('click', () => {
  document.getElementById('shareModal').style.display = 'none';
  document.getElementById('overlayBg').style.display = 'none';
});
document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importCode').value = '';
  document.getElementById('importModal').style.display = 'block';
  document.getElementById('overlayBg').style.display = 'block';
});
document.getElementById('importLoad').addEventListener('click', () => {
  const code = document.getElementById('importCode').value;
  if (importLevel(code)) {
    document.getElementById('importModal').style.display = 'none';
    document.getElementById('overlayBg').style.display = 'none';
    buildPalette();
  } else {
    alert('Invalid level code!');
  }
});
document.getElementById('importClose').addEventListener('click', () => {
  document.getElementById('importModal').style.display = 'none';
  document.getElementById('overlayBg').style.display = 'none';
});

// Global Import modal handlers
document.getElementById('globalImportLoad').addEventListener('click', () => {
  const code = document.getElementById('globalImportCode').value.trim();
  if (!code) return;
  try {
    const lvl = JSON.parse(atob(code));
    if (!lvl.objects) throw new Error('No objects');
    const build = {
      name: lvl.name||'Imported Level', difficulty: lvl.difficulty||'Normal',
      speed: lvl.speed||7, bpm: lvl.bpm||140,
      color: lvl.color||'#4488ff',
      bgColor1: lvl.bgColor1||'#001155', bgColor2: lvl.bgColor2||'#0033aa',
      groundColor: lvl.groundColor||'#0033cc',
      objects: lvl.objects,
      author: lvl.author||'Unknown'
    };
    globalBuilds.push(build);
    saveGlobalBuilds();
    document.getElementById('globalImportModal').style.display = 'none';
    document.getElementById('overlayBg').style.display = 'none';
    menuTab = 'global';
    state = 'levelSelect'; menuHover = -1;
  } catch(e) {
    alert('Invalid level code!');
  }
});
document.getElementById('globalImportClose').addEventListener('click', () => {
  document.getElementById('globalImportModal').style.display = 'none';
  document.getElementById('overlayBg').style.display = 'none';
  state = 'levelSelect'; menuHover = -1;
});

// ============================================================
// MENU MOUSE HANDLING
// ============================================================
canvas.addEventListener('mousemove', e => {
  if (state === 'playing' || state === 'testPlay' || state === 'editor') return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  menuHover = -1;
  menuButtons.forEach((btn,i) => {
    if (mx>=btn.x && mx<=btn.x+btn.w && my>=btn.y && my<=btn.y+btn.h) menuHover = i;
  });
});

canvas.addEventListener('click', e => {
  if (state === 'playing' || state === 'testPlay' || state === 'editor') return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  AudioEngine.init();
  for (let i = 0; i < menuButtons.length; i++) {
    const btn = menuButtons[i];
    if (mx>=btn.x && mx<=btn.x+btn.w && my>=btn.y && my<=btn.y+btn.h) {
      AudioEngine.playClick();
      switch (btn.action) {
        case 'play':
          if (customLevels.length > 0) {
            currentLevel=0; state='playing'; attempts=0; initLevel(0, 'my');
          } else if (globalBuilds.length > 0) {
            currentLevel=0; state='playing'; attempts=0; initLevel(0, 'global');
          } else {
            state='levelSelect'; menuHover=-1;
          }
          break;
        case 'levelSelect': state='levelSelect'; menuHover=-1; break;
        case 'editor':
          state='editor'; editorObjects=[]; editorScroll=0; editorEditingIdx=-1;
          editorLevelSettings={name:'My Level',difficulty:'Normal',speed:7,bpm:140,
            color:'#4488ff',bgColor1:'#001155',bgColor2:'#0033aa',groundColor:'#0033cc'};
          showEditor(); break;
        case 'settings': state='settings'; menuHover=-1; break;
        case 'menu': state='menu'; menuHover=-1; AudioEngine.stopMusic(); hideEditor(); break;
        case 'tab_my': menuTab='my'; menuHover=-1; break;
        case 'tab_global': menuTab='global'; menuHover=-1; break;
        case 'level':
          currentLevel=btn.level; state='playing'; attempts=0;
          initLevel(btn.level, btn.source||'my'); break;
        case 'retry': state='playing'; initLevel(currentLevel, playingLevelSource); break;
        case 'testRetry': startTestPlay(); break;
        case 'exitTest': state='editor'; AudioEngine.stopMusic(); showEditor(); break;
        case 'nextLevel':
          currentLevel++; state='playing'; attempts=0;
          initLevel(currentLevel, playingLevelSource); break;
        case 'globalImport':
          state='menu'; menuHover=-1;
          document.getElementById('globalImportModal').style.display='block';
          document.getElementById('overlayBg').style.display='block';
          break;
        case 'toggleSound':
          AudioEngine.muted=!AudioEngine.muted;
          if(AudioEngine.muted)AudioEngine.stopMusic(); saveSave(); break;
        case 'togglePractice': practiceMode=!practiceMode; break;
        case 'skin': currentSkin=btn.skinIdx; saveSave(); break;
      }
      break;
    }
  }
});

// ============================================================
// MAIN LOOP
// ============================================================
function gameLoop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  switch (state) {
    case 'menu': drawMenu(); break;
    case 'levelSelect': drawLevelSelect(); break;
    case 'settings': drawSettings(); break;
    case 'editor': drawEditor(); break;
    case 'playing': case 'testPlay':
      if(screenShake>0.5){ctx.save();ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);}
      updateGame(); drawBg(); drawGround(); drawObstacles(); drawPlayer(); drawParticles(); drawHUD();
      if(screenShake>0.5)ctx.restore();
      break;
    case 'dead': case 'testPlay_dead':
      drawBg(); drawGround(); drawObstacles(); drawParticles(); drawDeathScreen(); break;
    case 'complete':
      drawBg(); drawGround(); drawObstacles(); drawCompleteScreen(); break;
  }
  requestAnimationFrame(gameLoop);
}
// Auto-start from URL params for testing
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('level')) {
  const lvlIdx = parseInt(urlParams.get('level')) || 0;
  const src = urlParams.get('src') || 'my';
  if ((src === 'my' && customLevels[lvlIdx]) || (src === 'global' && globalBuilds[lvlIdx])) {
    initLevel(lvlIdx, src); state = 'playing';
  }
} else if (urlParams.has('select')) {
  state = 'levelSelect'; menuHover = -1;
} else if (urlParams.has('editor')) {
  state='editor'; editorObjects=[]; editorScroll=0; editorEditingIdx=-1;
  showEditor();
}
gameLoop();
</script>
